<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B8B2A0">
<title>Ledger</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231F5C4F'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23EDE7D3' font-family='monospace'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="active">Entry</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="conflicts.html">Conflicts <span id="conflictBadge" class="badge" style="display:none;"></span></a>
  <a href="instructions.html">Instructions</a>
  <a href="history.html">History</a>
  <a href="categories.html">Categories</a>
</nav>

<div class="receipt" id="summaryCard">
  <header>
    <div class="eyebrow">THIS MONTH SO FAR</div>
    <h1 style="font-size:24px;">Summary</h1>
  </header>
  <div class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="label">Today</div><div class="value" id="statToday">—</div></div>
    <div class="stat-card"><div class="label">This Month</div><div class="value" id="statMonth">—</div></div>
    <div class="stat-card"><div class="label">Fixed</div><div class="value" id="statFixed">—</div></div>
    <div class="stat-card"><div class="label">Variable</div><div class="value" id="statVariable">—</div></div>
    <div class="stat-card wide"><div class="label">Avg Daily Variable Spend</div><div class="value" id="statAvgVar">—</div></div>
  </div>
</div>

<div class="receipt">
  <header>
    <div class="eyebrow">EXPENSE LEDGER</div>
    <h1>New Entry</h1>
  </header>

  <div class="field">
    <label for="amount">Amount</label>
    <div class="amount-row">
      <span>₹</span>
      <input type="text" id="amount" inputmode="decimal" placeholder="0.00">
    </div>
  </div>

  <div class="field">
    <label>Category</label>
    <div class="chips" id="chips">
      <div class="empty-state" id="chipsLoading">Loading categories…</div>
    </div>
  </div>

  <div class="field">
    <label for="expense">Expense</label>
    <input type="text" id="expense" placeholder="e.g. lunch with Priya">
  </div>

  <div class="field">
    <label for="date">Date</label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <label>Type</label>
    <div class="chips" id="typeChips" style="grid-template-columns: repeat(2, 1fr);">
      <button type="button" class="chip selected" data-type="debit">Debit</button>
      <button type="button" class="chip" data-type="credit">Credit</button>
    </div>
  </div>

  <hr class="divider">

  <div class="submit-wrap">
    <button id="submitBtn">Stamp<br>Entry</button>
    <div class="status" id="status"></div>
  </div>

  <div class="tape" id="tape" style="display:none;">
    <div class="tape-title">Today's Tape</div>
    <div id="tapeRows"></div>
    <div class="tape-total"><span>Total</span><span id="tapeTotal">₹0.00</span></div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const chipsEl = document.getElementById('chips');
  let selectedCategory = null;

  function renderCategoryChips(categories) {
    chipsEl.innerHTML = '';
    if (categories.length === 0) {
      chipsEl.innerHTML = '<div class="empty-state">No categories yet — add one on the Categories page</div>';
      return;
    }
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = cat.name;
      btn.type = 'button';
      btn.onclick = () => {
        document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('selected'));
        btn.classList.add('selected');
        selectedCategory = cat.name;
      };
      chipsEl.appendChild(btn);
    });
  }

  async function loadCategories() {
    try {
      const data = await apiFetch('/categories');
      const active = data.categories.filter(c => c.is_active);
      renderCategoryChips(active);
    } catch (e) {
      chipsEl.innerHTML = `<div class="empty-state">Could not load categories: ${e.message}</div>`;
    }
  }

  async function loadSummary() {
    try {
      const s = await apiFetch('/summary/entry-page');
      document.getElementById('statToday').textContent = formatRupees(s.today_total);
      document.getElementById('statMonth').textContent = formatRupees(s.month_total);
      document.getElementById('statFixed').textContent = formatRupees(s.month_fixed_total);
      document.getElementById('statVariable').textContent = formatRupees(s.month_variable_total);
      document.getElementById('statAvgVar').textContent = formatRupees(s.avg_daily_variable_spend) + ' / day';
    } catch (e) {
      document.getElementById('summaryCard').innerHTML =
        `<div class="empty-state">Could not load summary: ${e.message}</div>`;
    }
  }

  loadCategories();
  loadSummary();

  document.getElementById('date').value = new Date().toISOString().slice(0, 10);

  let selectedType = 'debit';
  document.querySelectorAll('#typeChips .chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      selectedType = btn.dataset.type;
    });
  });

  let todayTotal = 0;
  const tapeEl = document.getElementById('tape');
  const tapeRowsEl = document.getElementById('tapeRows');
  const tapeTotalEl = document.getElementById('tapeTotal');

  function addTapeRow(amount, category, expenseDesc) {
    todayTotal += amount;
    tapeEl.style.display = 'block';
    const row = document.createElement('div');
    row.className = 'tape-row';
    row.innerHTML = `<span>${expenseDesc ? expenseDesc : category}</span><span class="cat">₹${amount.toFixed(2)}</span>`;
    tapeRowsEl.prepend(row);
    tapeTotalEl.textContent = `₹${todayTotal.toFixed(2)}`;
  }

  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const amountEl = document.getElementById('amount');
  const expenseEl = document.getElementById('expense');
  const dateEl = document.getElementById('date');

  submitBtn.addEventListener('click', async () => {
    statusEl.textContent = '';
    statusEl.className = 'status';

    const amount = parseFloat(amountEl.value);
    if (!amount || amount <= 0) {
      statusEl.textContent = 'Enter an amount first';
      statusEl.className = 'status error';
      return;
    }
    if (!selectedCategory) {
      statusEl.textContent = 'Pick a category';
      statusEl.className = 'status error';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'Stamping…';

    try {
      await apiFetch('/add-expense', {
        method: 'POST',
        body: JSON.stringify({
          amount: amount,
          category: selectedCategory,
          expense: expenseEl.value || null,
          expense_type: selectedType,
          expense_date: dateEl.value
        })
      });

      addTapeRow(amount, selectedCategory, expenseEl.value);

      submitBtn.classList.add('stamped');
      statusEl.textContent = 'Added';
      setTimeout(() => submitBtn.classList.remove('stamped'), 400);

      amountEl.value = '';
      expenseEl.value = '';
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('selected'));
      selectedCategory = null;
      document.querySelector('#typeChips .chip[data-type="debit"]').classList.add('selected');
      selectedType = 'debit';
      amountEl.focus();

      loadSummary(); // refresh totals to reflect the new entry
    } catch (e) {
      statusEl.textContent = e.message || 'Something went wrong';
      statusEl.className = 'status error';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
