name: process-standing-instructions

on:
  schedule:
    - cron: '0 1 * * *'   # 1:00 AM UTC = 6:30 AM IST -- adjust if you want a different local time
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install supabase python-dotenv
      - run: python scripts/standing_instructions.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}